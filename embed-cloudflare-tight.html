    :host { display: block; width: 100%; margin: 12px 0; color: #263329; text-align: left; }
    :host, * { font-family: "${FONT_FAMILY}", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: inherit; }
    .embed-shell { width: 100%; overflow: hidden; border: 1px solid #d8e0d5; border-radius: 12px; background: #f3f6ef; box-shadow: 0 5px 16px rgba(17, 48, 37, .1); }
    .price-row { display: flex; align-items: stretch; gap: 6px; padding: 6px; }
    .price-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex: 1; min-width: 0; gap: 6px; }
    .price-grid.is-three-up { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .price-grid.is-two-up { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .price-card { overflow: hidden; min-width: 0; border: 1px solid #d8e0d5; border-radius: 10px; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04); transition: transform .18s ease, box-shadow .18s ease; }
    .price-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(17, 48, 37, .11); }
    .price-card a { display: flex; align-items: stretch; min-height: 56px; padding: 0; text-decoration: none; }
    .price-card.is-wiping-out { animation: board-wipe .42s cubic-bezier(.65, 0, .84, .36) var(--wipe-delay, 0ms) both; will-change: clip-path, opacity; }
    .commodity-image { display: block; width: 55px; height: auto; min-height: 100%; flex: 0 0 55px; overflow: hidden; border: 0; border-radius: 0; background: #f2f5ec; }
    .commodity-image img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
    .compact-copy { display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; padding: 2px 8px; }
    .commodity-name { display: block; overflow: hidden; color: #263329; font-size: 13px; font-weight: 700; line-height: 1.5; padding-top: 2px; text-overflow: ellipsis; white-space: nowrap; }
    .price-line { display: block; min-width: 0; }
    .price { display: block; color: #c2410c; font-size: var(--price-size, 15px); font-weight: 700; line-height: 18px; letter-spacing: -.03em; }
    .price-delta { display: inline-flex; align-items: center; gap: 3px; border: 0; border-radius: 0; font-size: var(--delta-size, 10px); font-weight: 700; line-height: 14px; }
    .price-delta.up { color: #14804a; }
    .price-delta.down { color: #c2410c; }
    .price-delta.flat, .price-delta.none { color: #667064; }
    .delta-icon { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex: 0 0 14px; font-size: 10px; line-height: 1; }
    .all-prices { display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: 0 0 auto; align-self: stretch; padding: 0 14px; border-radius: 10px; background: #3f7d4a; color: #fff; font-size: 11px; font-weight: 700; line-height: normal; text-decoration: none; }
    .all-prices:hover { background: #2f6b3a; }
    .cta-label { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cta-desktop { display: block; width: 88px; text-align: center; font-size: 14px; line-height: 1.25; word-break: keep-all; overflow-wrap: normal; }
    .cta-mobile { display: none; }
    .cta-arrow { display: inline-flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
    .price-grid.is-refresh .price-card { animation: top-roll .72s cubic-bezier(.2, .8, .25, 1) both; }
    .price-grid.is-refresh .price-card:nth-child(2) { animation-delay: 70ms; }
    .price-grid.is-refresh .price-card:nth-child(3) { animation-delay: 140ms; }
    .price-grid.is-refresh .price-card:nth-child(4) { animation-delay: 210ms; }
    .price-grid.is-refresh .price-delta { animation: delta-pop .9s cubic-bezier(.2, .8, .25, 1) both; }
    .price-grid.is-refresh .price { animation: price-pop .9s cubic-bezier(.2, .8, .25, 1) both; }
    .price-delta.steep-up, .price-delta.steep-down { font-weight: 900; transform-origin: left center; }
    .price-delta.steep-up { animation: steep-up-emphasis .75s ease-in-out infinite; }
    .price-delta.steep-down { animation: steep-down-emphasis .75s ease-in-out infinite; }
    .price-grid.is-refresh .price-delta.steep-up { animation: steep-up-emphasis .75s ease-in-out infinite; }
    .price-grid.is-refresh .price-delta.steep-down { animation: steep-down-emphasis .75s ease-in-out infinite; }
    .price-card.steep-up > a { animation: steep-up-card .75s ease-in-out infinite; }
    .price-card.steep-down > a { animation: steep-down-card .75s ease-in-out infinite; }
    @keyframes top-roll { 0% { opacity: 0; clip-path: inset(0 0 100% 0); } 60% { opacity: 1; } 100% { opacity: 1; clip-path: inset(0 0 0 0); } }
    @keyframes delta-pop { 0% { opacity: 0; transform: scale(.65); box-shadow: 0 0 0 0 currentColor; } 45% { opacity: 1; transform: scale(1.16); box-shadow: 0 0 0 5px transparent; } 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 transparent; } }
    @keyframes price-pop { 0% { opacity: 0; transform: scale(.65); } 45% { opacity: 1; transform: scale(1.16); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes steep-up-emphasis { 0%, 100% { color: #14804a; transform: scale(1); } 50% { color: #0b6b3a; transform: scale(1.08); } }
    @keyframes steep-down-emphasis { 0%, 100% { color: #c2410c; transform: scale(1); } 50% { color: #a9320a; transform: scale(1.08); } }
    @keyframes steep-up-card { 0%, 100% { background: #fff; } 50% { background: #dff3e5; } }
    @keyframes steep-down-card { 0%, 100% { background: #fff; } 50% { background: #ffe4dc; } }
    @keyframes board-wipe { 0% { opacity: 1; clip-path: inset(0 0 0 0); } 48% { opacity: 1; clip-path: inset(0 0 0 48%); } 100% { opacity: 0; clip-path: inset(0 0 0 100%); } }
    .state { padding: 26px 18px; color: #667064; font-size: 13px; line-height: 1.4; text-align: center; }
    @media (min-width: 621px) { .price-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; } }
    @media (max-width: 900px) { .price-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .price-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .price-line { display: flex; flex-direction: column; align-items: flex-start; gap: 0; } .price-delta { margin-top: 0; } .cta-desktop { display: none; } .cta-mobile { display: block; font-size: 15px; line-height: 1.15; } .all-prices { flex-direction: column; gap: 5px; padding: 8px 14px; } .cta-arrow { font-size: 14px; } }
    @media (max-width: 380px) { .price-row { padding-inline: 5px; } .commodity-image { width: 50px; flex-basis: 50px; } .compact-copy { padding: 2px 6px; } .commodity-name { font-size: 12px; } .price { --price-size: 14px; } .price-delta { --delta-size: 9px; } .all-prices { padding-inline: 7px; font-size: 10px; } }
    @media (prefers-reduced-motion: reduce) { .price-card { transition: none; } .price-grid.is-refresh .price-card, .price-grid.is-refresh .price, .price-grid.is-refresh .price-delta, .price-card.is-wiping-out, .price-card.steep-up > a, .price-card.steep-down > a { animation: none; } .price-delta.steep-up, .price-delta.steep-down { transform: scale(1.08); } }
  `;
  const host = document.createElement("section");
  host.setAttribute("data-dharane-price-embed", "true");
  host.setAttribute("aria-live", "polite");
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>${styles}</style><main class="embed-shell"><div class="state">${copy.loading}</div></main>`;
  script.parentNode.insertBefore(host, script.nextSibling);
  const widget = root.querySelector(".embed-shell");
  const setWidgetVisibility = (visible) => { host.hidden = !visible; host.setAttribute("aria-hidden", String(!visible)); };
  let renderedCount = 0;
  let refreshTimer = null;
  let lastCommodityKeys = new Set();
  let rotationCount = 0;

  const escapeHtml = (value) => String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[character]));
  const fetchJson = (url) => fetch(url, { cache: "no-store" }).then((response) => { if (!response.ok) throw new Error(`Request failed: ${response.status}`); return response.json(); });
  const translate = (translations, group, value) => translations && translations[group] && translations[group][value] && translations[group][value][locale] || value;
  const commodityKey = (value) => String(value || "").trim().toLowerCase();
  const isSteep = (item) => typeof item.deltaMaxPrice === "number" && Number.isFinite(item.previousMaxPrice) && item.previousMaxPrice > 0 && Math.abs(item.deltaMaxPrice) >= item.previousMaxPrice * 0.1;
  const shuffle = (items) => { for (let i = items.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; } return items; };
  const formatPrice = (value) => `₹${new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 }).format(value)}`;
  const formatDate = (value) => new Intl.DateTimeFormat(locale === "kn" ? "kn-IN" : "en-IN", { day: "numeric", month: "short", year: "numeric" }).format(new Date(`${value}T00:00:00`));
  const dashboardLink = (commodity) => { const url = new URL(DASHBOARD_URL); url.searchParams.set("view", "table"); url.searchParams.set("type", "commodity"); url.searchParams.set("commodity", commodity); url.searchParams.set("origin", "embed"); return url.href; };
  const deltaIcon = (delta) => delta > 0
    ? `<span class="delta-icon" aria-hidden="true">&#9650;</span>`
    : delta < 0 ? `<span class="delta-icon" aria-hidden="true">&#9660;</span>` : "";

  const visibleCount = () => { const width = host.getBoundingClientRect().width || window.innerWidth; return width >= 900 ? 4 : width >= 620 ? 3 : 2; };

  const decodeObservations = (payload) => Array.isArray(payload) ? payload : (payload.rows || []).map((encodedRow) => {
    const row = {};
    encodedRow.forEach((cell, index) => { row[payload.columns[index]] = cell === null ? null : payload.dictionaries[payload.columns[index]][cell]; });
    return row;
  });

  const recentAnnouncedDates = (runLog) => {
    const now = new Date();
    const yesterday = new Date(now);
    yesterday.setHours(0, 0, 0, 0);
    yesterday.setDate(yesterday.getDate() - 1);
    return new Set((runLog.runs || [])
      .filter((run) => run.status === "success" && run.actual_report_date && new Date(run.run_timestamp) >= yesterday && new Date(run.run_timestamp) <= now)
      .map((run) => run.actual_report_date));
  };

  const buildFeed = (payload, runLog) => {
    const rows = decodeObservations(payload);
    const announcedDates = recentAnnouncedDates(runLog);
    const latestByCommodity = new Map();
    rows.filter((row) => announcedDates.has(row.reportDate) && row.commodity && typeof row.maxPrice === "number" && Number.isFinite(row.maxPrice)).forEach((row) => {
      const current = latestByCommodity.get(commodityKey(row.commodity));
      if (!current || row.reportDate > current.reportDate || row.reportDate === current.reportDate && row.maxPrice > current.maxPrice) latestByCommodity.set(commodityKey(row.commodity), row);
    });
    return { prices: [...latestByCommodity.values()].sort((a, b) => a.commodity.localeCompare(b.commodity)).map((row) => {
      const previous = rows.filter((candidate) => candidate.commodity === row.commodity && candidate.market === row.market && candidate.variety === row.variety && candidate.sourceId === row.sourceId && candidate.grade === row.grade && candidate.reportDate < row.reportDate && typeof candidate.maxPrice === "number")
        .sort((a, b) => b.reportDate.localeCompare(a.reportDate) || b.maxPrice - a.maxPrice)[0];
      return { ...row, previousMaxPrice: previous ? previous.maxPrice : null, deltaMaxPrice: previous ? row.maxPrice - previous.maxPrice : null, unit: row.priceDisplayUnit || row.unit || "", imageUrl: IMAGE_URLS[row.commodity] || FALLBACK_THUMB };
    }) };
  };

  function render(feed, translations, animate = false) {
    const recent = feed.prices || [];
    const changed = recent.filter((item) => item.deltaMaxPrice !== null && item.deltaMaxPrice !== 0);
    const count = visibleCount();
    renderedCount = count;
    const pool = changed.length >= count ? changed : recent;
    const fresh = pool.filter((item) => !lastCommodityKeys.has(commodityKey(item.commodity)));
    const selectionPool = fresh.length >= count ? fresh : pool;
    const prices = shuffle(selectionPool.slice()).slice(0, count);
    const layoutClass = count === 4 ? "" : count === 3 ? " is-three-up" : " is-two-up";
    if (rotationCount > 0 && rotationCount % 3 === 0 && !prices.some(isSteep)) {
      const steepCandidate = shuffle(pool.filter(isSteep).filter((item) => !prices.some((price) => commodityKey(price.commodity) === commodityKey(item.commodity))))[0] || shuffle(pool.filter(isSteep))[0];
      if (steepCandidate) prices[0] = steepCandidate;
    }
    if (!prices.length) {
      setWidgetVisibility(false);
      widget.innerHTML = "";
      return;
    }
    setWidgetVisibility(true);
    lastCommodityKeys = new Set(prices.map((item) => commodityKey(item.commodity)));
    const cards = prices.map((item) => {
      const commodity = translate(translations, "commodities", item.commodity);
      const delta = item.deltaMaxPrice;
      const steep = isSteep(item);
      const deltaClass = `${delta === null ? "none" : delta > 0 ? "up" : delta < 0 ? "down" : "flat"}${steep ? delta > 0 ? " steep-up" : " steep-down" : ""}`;
      const deltaValue = delta === null ? "-" : delta === 0 ? "-" : `${delta > 0 ? "+" : "-"}₹${new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 }).format(Math.abs(delta))}`;
      const steepCardClass = steep ? delta > 0 ? " steep-up" : " steep-down" : "";
      return `<article class="price-card${steepCardClass}"><a href="${escapeHtml(dashboardLink(item.commodity))}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(commodity)} ${escapeHtml(formatPrice(item.maxPrice))}"><span class="commodity-image"><img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(commodity)}" loading="lazy" decoding="async"></span><span class="compact-copy"><span class="commodity-name">${escapeHtml(commodity)}</span><span class="price-line"><span class="price">${escapeHtml(formatPrice(item.maxPrice))}</span><span class="price-delta ${deltaClass}" aria-label="${escapeHtml(copy.change)} ${escapeHtml(deltaValue)}">${escapeHtml(deltaValue)} ${deltaIcon(delta)}</span></span></span></a></article>`;
    }).join("");
    const homeUrl = `${DASHBOARD_URL}?origin=embed`;
    widget.innerHTML = `<div class="price-row"><section class="price-grid${layoutClass}${animate ? " is-refresh" : ""}" aria-label="${copy.kicker}">${cards}</section><a class="all-prices" href="${homeUrl}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(copy.viewAll)}"><span class="cta-label"><span class="cta-desktop">${escapeHtml(copy.viewAll)}</span><span class="cta-mobile">${escapeHtml(copy.viewAllShort)}</span></span><span class="cta-arrow" aria-hidden="true">→</span></a></div>`;
  }

  function refresh(feed, translations) {
    const renderRefresh = () => { rotationCount += 1; render(feed, translations, true); };
    const cards = [...root.querySelectorAll(".price-card")];
    if (!cards.length || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      renderRefresh();
      return;
    }
    cards.forEach((card, index) => {
      card.style.setProperty("--wipe-delay", `${index * 120}ms`);
      card.classList.add("is-wiping-out");
    });
    if (refreshTimer !== null) window.clearTimeout(refreshTimer);
    refreshTimer = window.setTimeout(() => {
      refreshTimer = null;
      renderRefresh();
    }, 420 + Math.max(0, cards.length - 1) * 120);
  }

  Promise.all([fontReady, fetchJson(DATA_URL), fetchJson(RUNS_URL), fetchJson(TRANSLATIONS_URL)])
    .then(([, observations, runLog, translations]) => {
      const feed = buildFeed(observations, runLog);
      render(feed, translations);
      window.setInterval(() => refresh(feed, translations), 9000);
      if (window.ResizeObserver) {
        new ResizeObserver(() => { const count = visibleCount(); if (count !== renderedCount) refresh(feed, translations); }).observe(host);
      }
    })
    .catch(() => { setWidgetVisibility(false); widget.innerHTML = ""; });
})();
    </script>
  </body>
</html>
